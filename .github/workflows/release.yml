name: Release de l'application

# Une release est créée automatiquement quand le numéro de « version » de package.json change sur main.
# Le workflow crée alors le tag correspondant (v1.0.0, v1.1.0…) et publie l'appli pour
# macOS (Apple Silicon et Intel), Windows (installation et portable) et Linux (AppImage et tar.gz).
on:
  push:
    branches: [main]
    paths:
      - "package.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: Nouvelle version ?
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "La version v$VERSION existe déjà : pas de nouvelle release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Nouvelle version v$VERSION : construction de la release."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.name }}
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
            target: --mac
          - os: windows-latest
            name: Windows
            target: --win
          - os: ubuntu-latest
            name: Linux
            target: --linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Sur les machines macOS de GitHub, Spotlight indexe le disque .dmg pendant sa création
      # et empêche de le démonter : on le désactive.
      - name: Désactiver Spotlight (macOS)
        if: runner.os == 'macOS'
        run: sudo mdutil -a -i off

      - name: Construire l'application
        shell: bash
        run: |
          # Une deuxième tentative en cas d'erreur passagère (disque .dmg encore occupé, téléchargement interrompu)
          build() { npx electron-builder "$@" --publish never || { sleep 15; npx electron-builder "$@" --publish never; }; }
          if [ "$RUNNER_OS" = "macOS" ]; then
            # Les deux .dmg (Apple Silicon et Intel) portent le même nom de disque :
            # construits en même temps, ils se bloquent l'un l'autre. On les construit l'un après l'autre.
            build --mac --arm64
            build --mac --x64
          else
            build ${{ matrix.target }}
          fi
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publier la release
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Kit Effets Spéciaux v${{ needs.check.outputs.version }}
          files: dist/*
          body: |
            ## Télécharger

            | Système | Fichier |
            | --- | --- |
            | macOS, Mac récent (puce Apple M1 à M4) | `kit-effets-speciaux-…-mac-arm64.dmg` |
            | macOS, Mac Intel | `kit-effets-speciaux-…-mac-x64.dmg` |
            | Windows, installation | `kit-effets-speciaux-…-windows-installation.exe` |
            | Windows, sans installation | `kit-effets-speciaux-…-windows-portable.exe` |
            | Linux | `kit-effets-speciaux-…-linux-x86_64.AppImage` |

            ## Premier lancement

            L'application n'est pas signée.
            - **macOS** : clic droit sur l'application, puis « Ouvrir », puis « Ouvrir » à nouveau. Autorisez ensuite la caméra.
            - **Windows** : si SmartScreen s'affiche, cliquez sur « Informations complémentaires », puis « Exécuter quand même ».
            - **Linux** : rendez le fichier AppImage exécutable (`chmod +x`), puis lancez-le.

            Version en ligne, sans installation : https://bibliogironde.github.io/kit-effets-speciaux/
